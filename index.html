<style>
:root{--bg:#ffe9f6;--card:#ffffffcc;--fg:#2a1b4d;--acc:#7c3aed;box-sizing:border-box}

[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#c{position:fixed;top:0;left:50%;transform:translateX(-50%);display:block}
#ui{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:var(--w,100vw);pointer-events:none;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 0;box-sizing:border-box}
#lb{pointer-events:auto;margin-right:48px;background:var(--card);border-radius:14px;padding:4px 12px;display:flex;flex-direction:column;font-weight:600;font-size:15px;line-height:1.35;backdrop-filter:blur(6px)}

#lb .p{flex:1;overflow:hidden;text-overflow:ellipsis}

#btns{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:8px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#btns button{width:36px;height:36px;padding:0;border:0;border-radius:12px;background:var(--card);font-size:18px;line-height:36px;cursor:pointer;color:var(--fg);backdrop-filter:blur(6px)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

#bar button{pointer-events:auto;font:700 13px 'Baloo 2',sans-serif;border:0;border-radius:12px;padding:5px 9px;background:var(--card);color:var(--fg);cursor:pointer;backdrop-filter:blur(6px)}

#bk{background:var(--acc);color:#fff}
#bc{position:fixed;left:50%;transform:translateX(-50%);top:calc(50% - 54px + 100px*var(--sc,1));font:700 16px 'Baloo 2',sans-serif;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:8px 18px;z-index:2;cursor:pointer}

#bw{font-size:14px!important}

.pv{position:absolute;inset:0;width:100%;height:100%;z-index:0}

#spx{margin-top:12px;width:100%;border:0;border-radius:14px;padding:8px;background:var(--acc);color:#fff;font:700 15px 'Baloo 2',sans-serif;cursor:pointer}

#npcx{background:var(--card);color:var(--fg)}

#sht{margin:10px 0;font:600 14px 'Baloo 2',sans-serif;line-height:1.4;overflow-wrap:anywhere}

</style>
