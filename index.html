<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}

.pv{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.sc .st{position:relative;z-index:1;font-size:12px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#spx{margin-top:12px;width:100%;border:0;border-radius:14px;padding:8px;background:var(--acc);color:#fff;font:700 15px 'Baloo 2',sans-serif;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" width="360" height="600"></canvas>

</div>

<script>

var dpr=Math.min(window.devicePixelRatio||1,3),rows=7;

/* sound */

}

/* ===== extra features ===== */
var WK=Math.floor((Date.now()/864e5+3)/7),mode='classic',target=+(new URLSearchParams(location.search).get('c'))||0,slow=+ld('tsSlow',1),slowT=0,used=0,overs=0,rs=1,dm=[],sig='',streak=+ld('tsStreak',0);
var today=new Date().toISOString().slice(0,10);
function rseed(){var h=0,k=mode==='daily'?today:'r'+Math.random();for(var i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))|0;rs=h||1;dm=[];for(i=0;i<200;i++)dm.push(.85+rnd()*.5)}

var tt;function toast(m){var e=$('toast');e.textContent=m;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){e.style.opacity=0},2800)}

/* ADS: Monetag Vignette (zone 12308196) triggered safely on session break (every 3rd game over) */
var adPause=false,adMute=false,lastVignetteAt=0;
function adStart(){adPause=true;adMute=true;try{if(AC&&AC.suspend)AC.suspend()}catch(e){}}

function cgs(){return window.CrazyGames&&window.CrazyGames.SDK}
function gp(on){try{var S=cgs();if(S&&S.game)on?S.game.gameplayStart():S.game.gameplayStop()}catch(e){}}

function triggerMonetagVignette(){
  var now=Date.now();
  // Safe frequency cap: every 3rd game over and at least 25s cooldown between vignette loads
  if(overs%3!==0||(now-lastVignetteAt)<25000)return;
  lastVignetteAt=now;
  adStart();
  try{
    var s=document.createElement('script');
    s.dataset.zone='12308196';
    s.src='https://n6wxm.com/vignette.min.js';
    s.async=true;
    s.onload=function(){setTimeout(adEnd,1200)};
    s.onerror=function(){adEnd()};
    var targetEl=[document.documentElement,document.body].filter(Boolean).pop();
    if(targetEl)targetEl.appendChild(s);
    else adEnd();
    setTimeout(adEnd,5000);
  }catch(e){
    adEnd();
  }
}

var ADS={
  rewarded:function(cb){
    var S=cgs(),noAd=function(){adEnd();toast('No ad available right now. Try again later.')};
    if(S&&S.ad){S.ad.requestAd('rewarded',{adStarted:adStart,adFinished:function(){adEnd();cb()},adError:noAd});return}

    var iv=setInterval(function(){n--;$('adt').textContent='Ad playing... '+n;if(n<=0){clearInterval(iv);o.hidden=true;adEnd();cb()}},1000)},
  interstitial:function(cb){
    var S=cgs(),done=function(){adEnd();cb()};

    if(window.gdsdk&&window.gdsdk.showAd){adStart();window.gdsdk.showAd().then(done).catch(done);return}
    cb()}};
try{var S0=cgs();if(S0&&S0.init)Promise.resolve(S0.init()).catch(function(){})}catch(e){}
/* skins */
var SK=[['Rainbow',function(i){return[(i*14+200)%360,80]},0],['Neon',function(i){return[i%2?300:170,100]},10],['Candy',function(i){return[i%2?340:190,75]},20],['Christmas',function(i){return i%2?[0,72]:[142,55]},30,'hsl(0,0%,97%)'],['New Year',function(i){return[[48,95],[280,70],[330,80],[210,85]][i%4]},40,'hsl(48,100%,82%)'],['Gold',function(i){return[38+(i%3)*5,95]},-1],['Halloween',function(i){return[[28,95],[275,55],[28,95],[95,55]][i%4]},0,'hsl(33,100%,74%)']];
var unl=Math.max(1,+ld('tsUnl',1)),skin=+ld('tsSkin2',0);if(skin>=unl)skin=0;
function col(i,l){var a=SK[skin][1](i);return 'hsl('+a[0]+','+a[1]+'%,'+l+'%)'}
function unlocked(k){return k<unl}
function reqText(k){return k===unl?'Stack '+(10+2*(k-1))+' blocks on the '+SK[k-1][0]+' skin to unlock':'Unlock the previous skin first'}
function unlockCheck(){if(skin===unl-1&&unl<SK.length&&score>=10+2*skin){unl++;sv('tsUnl',unl);toast('🎉 New skin unlocked: '+SK[unl-1][0]+'!')}}
function setSkin(k){skin=k;sv('tsSkin2',k);toast('🎨 '+SK[k][0])}
function buildSk(){var g=$('spg');g.textContent='';SK.forEach(function(q,k){var b=document.createElement('button'),sw=document.createElement('div'),nm=document.createElement('div'),st=document.createElement('div');
  b.className='sc'+(k===skin?' sel':'');sw=document.createElement('canvas');sw.width=120;sw.height=96;sw.className='pv';drawPrev(sw,k);
  nm.textContent=q[0];nm.className='nm';st.textContent=k===skin?'✓ Equipped':unlocked(k)?'Equip':k===unl?'🔒 Stack '+(10+2*(k-1))+' on '+SK[k-1][0]:'🔒 Locked';
  b.appendChild(sw);b.appendChild(nm);b.appendChild(st);b.onclick=function(){pick(k)};g.appendChild(b)})}
function drawPrev(cv,k){var g=cv.getContext('2d'),w=cv.width,h=cv.height,q=SK[k],n=q[0],dk=theme==='dark',bc=BG[n],gr=g.createLinearGradient(0,0,0,h),m,a;
  if(bc){gr.addColorStop(0,dk?bc[2]:bc[0]);gr.addColorStop(1,dk?bc[3]:bc[1])}else{gr.addColorStop(0,'hsl(250,'+(dk?'55%,24%':'85%,82%')+')');gr.addColorStop(1,'hsl(300,'+(dk?'60%,8%':'85%,94%')+')')}

  else if(n!=='Rainbow'){if(n==='Halloween'){g.fillStyle='rgba(255,190,100,.9)';g.beginPath();g.arc(w*.8,h*.32,11,0,7);g.fill()}for(m=0;m<18;m++){var px=(m*41+7)%w,py=(m*29+5)%(h-8);
    if(n==='Christmas'){g.fillStyle='rgba(255,255,255,.95)';g.beginPath();g.arc(px,py,1.8,0,7);g.fill()}
    else if(n==='New Year'){g.fillStyle='hsl('+(m*47%360)+',90%,60%)';g.save();g.translate(px,py);g.rotate(m);g.fillRect(-3,-2,6,4);g.restore()}
    else if(n==='Candy'){g.strokeStyle=dk?'rgba(255,255,255,.4)':'rgba(255,255,255,.95)';g.beginPath();g.arc(px,py,4+m%3,0,7);g.stroke()}
    else if(n==='Halloween'){if(m<5){g.fillStyle=dk?'#000':'#2b1740';g.beginPath();g.moveTo(px-6,py-3);g.lineTo(px,py+2);g.lineTo(px+6,py-3);g.lineTo(px,py-1);g.fill()}}
    else{g.fillStyle='#ffd24a';g.globalAlpha=.4+.6*((m%4)/3);g.beginPath();g.arc(px,py,1.6,0,7);g.fill();g.globalAlpha=1}}}
  var bw=[70,58,46],bh=14,d=5,y0=h-6;
  for(var i=0;i<3;i++){var c=q[1](i),bx=(w-bw[i])/2+(i%2?5:-3),by=y0-(i+1)*bh,hs='hsl('+c[0]+','+c[1]+'%,';
    g.fillStyle=hs+'58%)';g.fillRect(bx,by,bw[i],bh-1);
    g.fillStyle=q[3]||hs+'74%)';g.beginPath();g.moveTo(bx,by);g.lineTo(bx+d,by-d);g.lineTo(bx+bw[i]+d,by-d);g.lineTo(bx+bw[i],by);g.fill();
    g.fillStyle=hs+'42%)';g.beginPath();g.moveTo(bx+bw[i],by);g.lineTo(bx+bw[i]+d,by-d);g.lineTo(bx+bw[i]+d,by+bh-1-d);g.lineTo(bx+bw[i],by+bh-1);g.fill()}}
function pick(k){if(unlocked(k)){setSkin(k);buildSk();$('sp').hidden=true}else toast('🔒 '+SK[k][0]+': '+reqText(k))}
$('bk').onclick=function(){buildSk();$('sp').hidden=false};$('spx').onclick=function(){$('sp').hidden=true};
var fx=[];for(var q=0;q<40;q++)fx.push({x:Math.random()*W,y:Math.random()*H,r:1.5+Math.random()*2.5,v:.6+Math.random()*1.4,s:Math.random()*6,c:'hsl('+(Math.random()*360|0)+',90%,60%)'});
function halloween(p,m,dk){
  if(m>=14)return;
  if(m%5===0){p.y-=p.v*.4;p.x+=Math.sin(p.s)*.5;if(p.y<-20)p.y=H+20;x.globalAlpha=.55;x.font='22px sans-serif';x.textAlign='center';x.fillText(m%2?'🎃':'👻',p.x,p.y);x.globalAlpha=1;return}
  p.x+=p.v*1.2;p.y+=Math.sin(p.s)*.6;if(p.x>W+20)p.x=-20;
  var wy=Math.sin(p.s*6)*5;x.fillStyle=dk?'#05020a':'#2b1740';
  x.beginPath();x.ellipse(p.x,p.y,4,5,0,0,7);x.fill();
  x.beginPath();x.moveTo(p.x-3,p.y);x.quadraticCurveTo(p.x-12,p.y-8+wy,p.x-16,p.y+2);x.quadraticCurveTo(p.x-9,p.y+1,p.x,p.y+4);x.fill();
  x.beginPath();x.moveTo(p.x+3,p.y);x.quadraticCurveTo(p.x+12,p.y-8+wy,p.x+16,p.y+2);x.quadraticCurveTo(p.x+9,p.y+1,p.x,p.y+4);x.fill()}
var BG={'Halloween':['#ffd9a8','#e6d0ff','#12061f','#2a0a0a'],'Neon':['#ffd1ff','#c9f3ff','#13042e','#04122e'],'Candy':['#ffd6ea','#d6f0ff','#4a1a45','#1c2f55'],'Christmas':['#d8f5e6','#ffe5e5','#0a3322','#3a0d14'],'New Year':['#fff0c4','#e8d5ff','#14082e','#3a1250'],'Gold':['#fff3c4','#ffe0a0','#2b1d05','#4a3008']};
function fxDraw(){var n=SK[skin][0],dk=theme==='dark';
  if(n==='Neon'){var t=(Date.now()/40)%40;x.strokeStyle=dk?'rgba(0,255,230,.16)':'rgba(180,0,200,.16)';x.lineWidth=1;x.beginPath();for(var g2=-40;g2<H;g2+=40){x.moveTo(0,g2+t);x.lineTo(W,g2+t)}for(g2=0;g2<=W;g2+=40){x.moveTo(g2,0);x.lineTo(g2,H)}x.stroke();return}
  if(n==='Halloween'){var mg=x.createRadialGradient(285,260,8,285,260,70);mg.addColorStop(0,dk?'rgba(255,214,150,.95)':'rgba(255,170,60,.7)');mg.addColorStop(.35,dk?'rgba(255,190,110,.5)':'rgba(255,160,50,.35)');mg.addColorStop(1,'rgba(255,160,50,0)');x.fillStyle=mg;x.beginPath();x.arc(285,260,70,0,7);x.fill()}
  fx.forEach(function(p,m){p.s+=.05;

    else if(n==='Rainbow'){p.y-=p.v*.3;if(p.y<-20)p.y=H+20;x.fillStyle=dk?'rgba(255,255,255,.07)':'rgba(255,255,255,.35)';x.beginPath();x.arc(p.x,p.y,p.r*4,0,7);x.fill()}
    else if(n==='Christmas'){p.y+=p.v;p.x+=Math.sin(p.s)*.5;if(p.y>H+6)p.y=-6;x.fillStyle='rgba(255,255,255,.9)';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}
    else if(n==='New Year'){p.s+=.05;p.y+=p.v*1.3;if(p.y>H+6)p.y=-6;x.save();x.translate(p.x,p.y);x.rotate(p.s);x.fillStyle=p.c;x.fillRect(-3,-2,6,4);x.restore()}
    else if(n==='Candy'){p.y-=p.v*.6;p.x+=Math.sin(p.s)*.4;if(p.y<-12)p.y=H+12;x.strokeStyle=dk?'rgba(255,255,255,.35)':'rgba(255,255,255,.9)';x.lineWidth=1.5;x.beginPath();x.arc(p.x,p.y,p.r*3,0,7);x.stroke()}
    else{p.y-=p.v*.25;if(p.y<-6)p.y=H+6;x.globalAlpha=.4+.6*Math.abs(Math.sin(p.s*2));x.fillStyle='#ffd24a';x.beginPath();x.arc(p.x,p.y,p.r*.8,0,7);x.fill();x.globalAlpha=1}})}
/* mid-game power-up orbs */
